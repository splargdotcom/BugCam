name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make build scripts executable
        run: chmod +x gradlew scripts/build-ubuntu.sh

      - name: Build, test and lint BugCam
        run: ./scripts/build-ubuntu.sh
