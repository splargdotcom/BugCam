name: Capture screenshot

on:
  push:
    paths:
      - ".github/workflows/capture-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take screenshot
        run: |
          mkdir -p docs/screenshots
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=6000 --screenshot=docs/screenshots/site.png https://bug.splarg.com/
          test -s docs/screenshots/site.png
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/site.png
          git commit -m "Add live site screenshot [skip ci]"
          git push
